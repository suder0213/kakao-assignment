<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 환경에서 화면 너비를 조절하는 역할을 함-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <!-- 앱 헤더 -->
      <header class="app-header">
        <h1 class="app-title">Todo</h1>
        <p class="app-subtitle">오늘 할 일을 정리해보세요</p>
      </header>

      <!-- Todo 입력 영역 -->
      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="할 일을 입력하세요"
            maxlength="100"
          />
          <!-- 버튼은 기본적으로 submit 역할을 함 -->
          <button id="addButton" class="btn btn-add">추가</button>
        </div>
        <!-- 입력값이 비어있을 때 표시되는 안내 메시지 -->
         <!-- hidden 클래스로 인해 평소에 보이지 않음, js에서 showError를 호출하면 hidden 클래스가 제거됨 -->
        <p id="errorMessage" class="error-message hidden">할 일을 입력해주세요.</p>
      </section>

      <!-- Todo 목록 영역 -->
      <section class="list-section">
        <!-- 완료 현황 카운터 -->
        <div class="list-header">
          <span id="todoCount" class="todo-count">0개</span>
          <span class="todo-count-label">의 할 일</span>
        </div>

        <!-- Todo 항목이 없을 때 표시되는 빈 상태 메시지 -->
        <div id="emptyState" class="empty-state">
          <p>아직 할 일이 없어요.</p>
          <p>새로운 할 일을 추가해보세요!</p>
        </div>

        <!-- Todo 항목 목록 -->
        <ul id="todoList" class="todo-list"></ul>
      </section>

    </div>

    <!-- JavaScript 파일 -->
    <script src="app.js"></script>
  </body>
</html>
